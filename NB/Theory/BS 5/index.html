<!DOCTYPE html>
<html>
    <head>
        <title></title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    </head>
    <body>
        <div class="container">
            <div class="row">
                <div class="col-md-4 border border-primary">DIV 1</div>
                <div class="col-md-4 border border-success">DIV 2</div>
                <div class="col-md-4 border border-warning">DIV 3</div>
            </div>
            <div class="row mt-2">
                <div class="col-md-12 col-lg-12">
                    <div class="alert alert-primary">This is an alert!</div>
                    <div class="alert alert-secondary">This is an alert!</div>
                    <div class="alert alert-success">This is an alert!</div>
                    <div class="alert alert-danger">This is an alert!</div>
                    <div class="alert alert-warning">This is an alert!</div>
                </div>
            </div>
            <div class="row">
                <div class="col-lg-6">
                    <button class="btn btn-primary">Primary</button>
                    <button class="btn btn-secondary">Secondary</button>
                    <button class="btn btn-success">Success</button>
                    <button class="btn btn-danger">Danger</button>
                    <button class="btn btn-warning">Warning</button>
                </div>
                <div class="col-lg-6">
                    <button class="btn btn-outline-primary">Primary</button>
                    <button class="btn btn-outline-secondary">Secondary</button>
                    <button class="btn btn-outline-success">Success</button>
                    <button class="btn btn-outline-danger">Danger</button>
                    <button class="btn btn-outline-warning">warning</button>

                </div>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
    </body>
</html>
