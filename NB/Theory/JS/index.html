<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title></title>
    <meta name="description" content="" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="" />
  </head>
  <body>
    <h1>JavaScript</h1>
    <input
      type="text"
      id="user_inp"
      placeholder="Enter text"
      onkeyup="userInput(this.value)"
    />
    <button onclick="userClick()">Click Me</button>
    <script>
      function userClick() {
        alert("Hello World!");
      }
      function userInput(data) {
        alert("Hey you typed a key!"+data);
      }
    </script>
  </body>
</html>
