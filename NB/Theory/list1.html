<!DOCTYPE HTML>
<html>
<head>
	<title>List </title>
</head>
<body>
	<h1>Frontend Technology</h1>
	<ol type="1" start="5">
		<li>HTML</li>
		<li>CSS</li>
		<li>Bootstrap</li>
		<li>JavaScript</li>
		<li>React</li>
		<li>Angular</li>
	</ol>
	<h1>Backend Technology</h1>
	<ul>
		<li>Node</li>
		<li>Java</li>
		<li>Django</li>
		<li>Go-Lang</li>
		<li>PHP</li>
	</ul>
	<!--
	<ol>: Ordered List
	<li>: List Item
	<ul>: unordered list
	-->
</body>
</html>
