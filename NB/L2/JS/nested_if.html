<!doctype html>
<html>
  <head>
    <title>Nested If</title>
  </head>
  <body>
    <select id="citizenship">
      <option value="">Select Citizenship</option>
      <option value="IN">Indian</option>
      <option value="US">USA</option>
      <option value="JP">JAPAN</option>
    </select>
    <input type="number" id="age" placeholder="Enter Age" />
    <button onclick="chkEligibility()">Check Eligibility</button>
    <div id="res"></div>
    <script>
      function chkEligibility() {
        let citizen = document.getElementById("citizenship").value;
        let age = document.getElementById("age").value;
        let resElem = document.getElementById("res");

        if (citizen === "IN") {
          if (age >= 18) {
            resElem.innerHTML = "<h1>You are eligible for vote!</h1>";
          } else {
            resElem.innerHTML = "<h1>You have to be 18 for voting</h1>";
          }
        } else {
          resElem.innerHTML = "<h1>You are not eligible for voting!</h1>";
        }
      }
    </script>
  </body>
</html>
