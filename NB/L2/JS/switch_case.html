<!doctype html>
<html>
  <head>
    <title>Switch case</title>
  </head>
  <body>
    <input type="number" id="num1" placeholder="Enter First Number" />
    <br />
    <input type="number" id="num2" placeholder="Enter Second Number" />
    <br />
    <button onclick="mathOper('add')">Add</button>
    <button onclick="mathOper('sub')">Sub</button>
    <button onclick="mathOper('multi')">Multiply</button>
    <div id="res"></div>
    <script>
      function mathOper(operation) {
        //debugger;
        let num1 = parseInt(document.getElementById("num1").value);
        let num2 = parseInt(document.getElementById("num2").value);
        let res = 0;
        let resElem = document.getElementById("res");
        switch (operation) {
          case "add":
            resElem.innerHTML = num1 + num2;
            break;

          case "sub":
            resElem.innerHTML = num1-num2;
            break;

          case "multi":
            resElem.innerHTML = num1*num2;
            break;

          default:
            resElem.innerHTML = `Invalid data!`;
        }
      }
    </script>
  </body>
</html>
