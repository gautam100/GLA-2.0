<html>
<head>
	<title>Web Form</title>
</head>
<body>
	<table align="center" border="1" cellpadding="20" cellspacing="0" width="80%">
	<tr>
		<td>Username:</td>
		<td><input type="text" id="user_name" name="user_name" /></td>

	</tr>
	<tr>
		<td>Password:</td>
		<td><input type="password" id="user_pwd" name="user_pwd" /></td>

	</tr>
	<tr>
		<td>Address:</td>
		<td>
		<textarea rows="6" cols="36" id="user_addr" name="user_addr"></textarea>
		</td>

	</tr>
	<tr>
		<td>Country</td>
		<td>
		<select name="user_country" id="user_country">
			<option value="">Choose Country</option>
			<option value="Ind">India</option>
			<option value="Au">Australia</option>
			<option value="US">United States</option>
			<option value="Jap">Japan</option>
		</select>
		</td>
	</tr>
	</table>
</body>
</html>
