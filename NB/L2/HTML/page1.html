<html>
<head>
	<title>Complex Table</title>
</head>
<body>
	<table align="center" border="1" cellpadding="20" cellspacing="0" width="80%">
	<tr>
		<th>A</th>
		<th>B</th>
		<th>C</th>
		<th rowspan="2">D</th>
	</tr>
	<tr>
		<th>E</th>
		<th>F</th>
		<th>G</th>
	</tr>
	<tr>
		<th>H</th>
		<th>I</th>
		<th colspan="2">J</th>
	</tr>
	<tr>
		<th colspan="4">K</th>
	</tr>

	</table>
</body>
</html>
