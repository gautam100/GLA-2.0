-->
<!doctype html>
<html>
  <head>
    <title></title>
    <link rel="stylesheet" href="" />
  </head>
  <body>
    <div id="err_container" style="color: red"></div>
    <input type="number" id="num1" placeholder="Enter first number" /> <br />
    <input type="number" id="num2" placeholder="Enter second number" /> <br />
    <input type="number" id="num3" placeholder="Enter third number" /> <br />
    <button onclick="chkHighest()">Print Highest</button>
    <div id="result"></div>
    <script>
      function validation(n1, n2, n3) {
        let msg = "";
        if (isNaN(n1)) {
          msg += "Please enter first number <br />";
        } else {
          msg += "";
        }
        if (isNaN(n2)) {
          msg += "Please enter second number <br />";
        } else {
          msg += "";
        }
        if (isNaN(n3)) {
          msg += "Please enter third number <br />";
        } else {
          msg += "";
        }
        document.getElementById("err_container").innerHTML = msg;
      }
      function chkHighest() {
        let a = parseInt(document.getElementById("num1").value);
        let b = parseInt(document.getElementById("num2").value);
        let c = parseInt(document.getElementById("num3").value);
        validation(a, b, c);

        if (a < b) {
          a = b;
        }
        if (a < c) {
          a = c;
        }
        document.getElementById("result").innerHTML = "Highest number is " + a;
      }
    </script>
  </body>
</html>
