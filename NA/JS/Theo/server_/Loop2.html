<!doctype html>
<html>
  <head>
    <title></title>
  </head>
  <body>
    <h1>Table</h1>
    <input type="number" id="user_inp" placeholder="Enter number" />
    <button onclick="prnTable()">Click</button>
    <div id="result"></div>
    <script>
      let prnTable = function () {
        //let num = 5;
        let num = parseInt(document.getElementById("user_inp").value)
        for (let i = 1; i <= 10; i++) {
          document.getElementById("result").innerHTML +=
            num + "X" + i + "=" + num * i + "<br />";
        }
      }
    </script>
  </body>
</html>
