<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Bootstrap</title>
    <meta name="description" content="" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div class="container">
      <h1>Bootstrap</h1>
      <div class="row">
        <div class="col-md-6 border border-primary">ABC</div>
        <div class="col-md-4 border border-danger">PQR</div>
        <div class="col-md-2 border border-warning">XYZ</div>
      </div>
      <div class="row">
        <div class="col-lg-12">
          <div class="alert alert-primary">This is alert box of bootstrap!</div>
          <div class="alert alert-danger">This is alert box of bootstrap!</div>
          <div class="alert alert-warning">This is alert box of bootstrap!</div>
          <div class="alert alert-success">This is alert box of bootstrap!</div>
          <div
            class="alert alert-warning alert-dismissible fade show"
            role="alert"
          >
            <strong>Holy guacamole!</strong> You should check in on some of
            those fields below.
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="alert"
              aria-label="Close"
            ></button>
          </div>
        </div>
      </div>

      <div class="row">
        <div class="col-md-6">
            <button class="btn btn-primary">Primary</button>
            <button class="btn btn-secondary">secondary</button>
            <button class="btn btn-info">info</button>
            <button class="btn btn-danger">Danger</button>
            <button class="btn btn-warning">warning</button>
        </div>
        <div class="col-md-6">
            <button type="button" class="btn btn-outline-primary">Primary</button>
            <button type="button" class="btn btn-outline-secondary">Primary</button>
            <button type="button" class="btn btn-outline-danger">Primary</button>
            <button type="button" class="btn btn-outline-warning">Primary</button>
        </div>
      </div>


    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
