<html>
<head>
	<title>Web Form1</title>
</head>
<body>
<form method="post">
<table align="center" border="1" cellpadding="5" cellspacing="0" width="70%">
	<tr>
		<td><label for="user_name">Username</label></td>
		<td><input type="text" id="user_name" name="user_name" /></td>
	</tr>
	<tr>
		<td><label for="user_pwd">Password</label></td>
		<td><input type="password" id="user_pwd" name="user_pwd" /></td>
	</tr>
	<tr>
		<td>Address</td>
		<td>
		<textarea rows="6" cols="32" id="user_addr" name="user_addr"></textarea>
		</td>

	</tr>
	
	<tr>
		<td>Country</td>
		<td>
			<select name="user_country" id="user_country">
				<option value="">Choose Country</option>
				<option value="Ind">India</option>
				<option value="US">USA</option>
				<option value="Aus">Australia</option>
				<option value="JP">Japan</option>
			</select>
		</td>
	</tr>

	<tr>
		<td colspan="2">
		<input type="submit" value="submit" id="submit_btn" name="submit_btn" />
		</td>
	</tr>	


</table>
</form>
</body>
</html>
