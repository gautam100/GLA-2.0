<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Screen</title>
    <link href="login.css" rel="stylesheet" />
  </head>
  <body>
    <div id="root" class="root">
      <div class="login-box">
        <h1>Login</h1>
        <!--First row begins -->
        <div class="row">
          <div class="col lbl-container">
            <label for="user_email" class="">Email</label>
          </div>
          <div class="col inp-box-container">
            <input class="inp-box"  type="email" id="user_email" placeholder="Enter Email..." />
          </div>
        </div>
        <!-- Second Row begins-->
        <div class="row">
          <div class="col lbl-container">
            <label for="user_pwd" class="">Password</label>
          </div>
          <div class="col inp-box-container">
            <input class="inp-box"  type="password" id="user_pwd" placeholder="Enter Password..." />
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
