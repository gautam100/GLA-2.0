<html>
<head>
	<title>Web Form 2</title>
</head>
<body>
	<form method="get">
	<table align="center" border="1" cellpadding="20" cellspacing="0" width="80%">
	<tr>
		<td>Gender</td>
		<td>
		<input type="radio" name="gender" id="gender1" value="male" checked /> <label for="gender1">MALE</label>
		<input type="radio" name="gender" id="gender2" value="female" /> <label for="gender2">FEMALE</label>
		</td>
	</tr>
	<tr>
	<td>Hobby</td>
	<td>
	<input type="checkbox" name="hobby" id="hobby1" value="gardening" />Gardening
	<input type="checkbox" name="hobby" id="hobby2" value="cooking" />Cooking
	<input type="checkbox" name="hobby" id="hobby3" value="swiming" />Swiming

	</td>
	</tr>
	<tr>
	<td colspan="2">
	<input type="submit" name="submit_btn" value="Submit" />
	<button id="submit_btn2">Submit</button>
	</td>
	</tr>
	</table>
</body>
</html>
