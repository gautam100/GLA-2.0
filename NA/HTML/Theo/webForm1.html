<!DOCTYPE HTML>
<html>
<head>
	<title>Web Form1</title>
</head>
<body>
	<form name="frm1" method="post"> 
	<table align="center" border="1" cellpadding="5" cellspacing="0" width="70%">
	<tr>
		<td>Username</td>
		<td><input type="text" id="user_name" name="user_name" /></td>
	</tr>
	<tr>
		<td>Password</td>
		<td><input type="password" id="user_pwd" name="user_pwd" /></td>
	</tr>
	<tr>
		<td>Address</td>
		<td><textarea rows="6" cols="32" id="user_addr"name="user_addr"> </textarea></td>
	</tr>
	<tr>
		<td colspan="2">
		<input type="submit" name="submit_btn" id="submit_btn" value="Click Me!" />
		</td>
	</tr>
	</table>
	</form>
</body>
</html>
