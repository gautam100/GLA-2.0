<html>
<head>
	<title>Web Form2</title>
</head>
<body>
<form method="post">
	<table>
	<tr>
		<td><label for="user_name">Name</label></td>
		<td><input type="text" placeholder="Enter name" id="user_name" name="user_name" required /></td>
	</tr>
	<tr>
		<td>Country</td>
		<td>
			<select id="country_dd" name="country_dd" multiple>
				<option value="">Select country</option>
				<option value="Ind">India</option>
				<option value="US" selected>USA</option>
				<option value="Aus">Australia</option>
				<option value="JP">Japan</option>
			</select>
		</td>
	</tr>
	
	<tr>
		<td>Gender</td>
		<td>
		<input type="radio" name="gender" id="gender_male" />Male
		<input type="radio" name="gender" id="gender_female" checked />Female	
		</td>
	</tr>

	<tr>	
		<td valign="top">Hobby</td>
		<td>
		<input type="checkbox" name="hobby" id="hobby1" />Gardening<br />
		<input type="checkbox" name="hobby" id="hobby2" />Cooking <br />
		<input type="checkbox" name="hobby" id="hobby3" />Swiming
		</td>
	</tr>

	<tr>
	<td colspan="2">
	<input type="submit" name="submit_btn" id="submit_btn" value="Signup" />
	<input type="reset" name="ireset_btn" id="reset_btn" value="Clear" />
	<button id="simple_btn" name="simple_btn"> Click ME!</button>
	</td>
	</tr>
	</table>

</form>
</body>
</html>
