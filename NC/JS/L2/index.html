<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title></title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
    </head>
    <body>
        <button onclick="ramu('water')">Ujjwal</button>
        <button onclick="ramu('medicine')">Nikhil</button>
        <button onclick="ramu('vegetable')">Rohit</button>

        

        <div id="result" style="width:400px; height:80px; border: 1px dotted #000;">
            This is a element whose id is result
        </div>
        <button onclick="clean()">Clear</button>
        <script>
            //Named function
            function ramu(order){
                //window.alert("I'll provide "+order+" soon!")
                //document.getElementById("result").innerHTML = "<h1>I'll provide "+order+" soon!</h1>"
                document.getElementById("result").innerHTML = `<h1>I'll provide ${order} soon!</h1>`
            }
            //Anonymous function
            let clean = function(){
                document.getElementById("result").innerHTML = ""

            }
        </script>
    </body>
</html>
