<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title></title>
    <meta name="description" content="" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="" />
  </head>
  <body>
    <p>
      WAP in which enter three numbers. Without using And, Or operators we need
      to print the highest number
    </p>
    <input type="number" id="num1" placeholder="Enter First number" /> <br />
    <input type="number" id="num2" placeholder="Enter Second number" /> <br />
    <input type="number" id="num3" placeholder="Enter Third number" /> <br />
    <button onclick="prnHighestNum()">Find the highest</button>
    <div id="res"></div>
    <script>
      function prnHighestNum() {
        //debugger;
        let a = parseInt(document.getElementById("num1").value);
        let b = parseInt(document.getElementById("num2").value);
        let c = parseInt(document.getElementById("num3").value);
        if (a < b) {
          a = b;
        }
        if (a < c) {
          a = c;
        }
        document.getElementById("res").innerHTML = "Highest number is " + a;
      }
    </script>
  </body>
</html>
