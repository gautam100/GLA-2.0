<!DOCTYPE html>
<html>
<head>
	<title>Web Form 2</title>
</head>
<body>
	<h1>Web Form</h1>
	<table>
	<tr>
		<td>Country</td>
		<td>
		<select name="country_dd" id="country_dd" multiple>
			<option value="">Select Country</option>
			<option value="Ind">India</option>
			<option value="US">USA</option>
			<option value="Aus" selected>Australia</option>
			<option value="JP">Japan</option>
		</select>
		</td>
	</tr>
	<tr>
		<td>Gender</td>
		<td>
		<input type="radio" name="gender" id="gender_male" value="male" />Male
		<input type="radio" name="gender" id="gender_female" value="male" checked />Female
		</td>

	</tr>

	</table>


</body>
</html>
