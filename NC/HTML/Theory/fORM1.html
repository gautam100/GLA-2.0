<!DOCTYPE HTML>
<html>
<head>
	<title>Web Form1</title>
</head>
<body>
<form>
<table align="center" border="1" cellpadding="5" cellspacing="0" width="70%">
	<tr>
		<td>Username</td>
		<td><input type="text" /></td>
	</tr>
	<tr>
		<td>Password</td>
		<td><input type="password" /></td>
	</tr>
	<tr>
		<td>Address</td>
		<td>
		<textarea rows="6" cols="36"></textarea>
		</td>
	</tr>
	<tr>
		<td colspan="2">
		<input type="submit" value="Sign Up!" />
		<input type="reset" value="Reset" name="reset_btn" />
		</td>
	</td>
</table>
</form>
</body>
</html>
