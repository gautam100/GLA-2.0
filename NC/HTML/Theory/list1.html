<!DOCTYPE HTML> 	
<html>
<head>
	<title>List in HTML</title>
</head>
<body>
	<h1> Frontend Technology </h1>
	<ol type="1" start="5">
		<li>HTML</li>
		<li>CSS</li>
		<li>Bootstrap</li>
		<li>JavaScript</li>
		<li>React</li>
		<li>Angular</li>
	</ol>
	<h1> Backend Technology </h1>
	<ul type="circle">
		<li>Node.JS</li>
		<li>Java</li>
		<li>Django</li>
		<li>Go Lang</li>
	</ul>
	<!-- 
	<ol>: Ordered List 
	<li>: List Item
	<ul>: Unordered List
	-->
</body>
</html>
